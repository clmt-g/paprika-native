stages:
  - info
  - build
  - test
  - quality
  - deploy

default:
  interruptible: false
  image: harbor.ad.supalta.com/library/phpci
  tags:
    - slam2

information-job:
  stage: info
  script:
    - uname -a
    - echo $PWD
    - env
    - php --version

build-job:
  stage: build
  script:
    - echo "Compiling the code..."
    - echo "Compile complete."

unit-test-job:
  stage: test
  script:
    - echo "Running unit tests... This will take about 60 seconds."
    - sleep 60
    - echo "Code coverage is 90%"

lint-test-job:
  stage: test
  script:
    - echo "Linting code... This will take about 10 seconds."
    - sleep 10
    - echo "No lint issues found."

phpcs-lint-job:
  stage: quality
  image: harbor.ad.supalta.com/library/phpci:8.3
  allow_failure: true
  before_script:
    - composer install
    - composer require --dev micheh/phpcs-gitlab
  script:
    - ./vendor/bin/phpcs --config-set ignore_errors_on_exit 1
    - ./vendor/bin/phpcs --config-set ignore_warnings_on_exit 1
    - ./vendor/bin/phpcs -s -p --extensions=php --report=full --standard=PSR12 app/
    - ./vendor/bin/phpcs --extensions=php --report=full --report-\Micheh\PhpCodeSniffer\Report\Gitlab=phpcs-quality-report.json --standard=PSR12 app/
  artifacts:
    reports:
      codequality:
        - phpcs-quality-report.json

phpstan-job:
  stage: quality
  image: harbor.ad.supalta.com/library/phpci:8.3
  before_script:
    - composer install
    - composer require --dev phpstan/phpstan
  script:
    - ./vendor/bin/phpstan analyse app --level=max
  artifacts:
    when: always
    paths:
      - phpstan.neon
    expire_in: 1 week

phpmetrics-job:
  stage: quality
  image: harbor.ad.supalta.com/library/phpci:8.3
  before_script:
    - composer global require phpmetrics/phpmetrics
  script:
    - phpmetrics --report-html=phpmetrics-report app/
  artifacts:
    paths:
      - phpmetrics-report
    expire_in: 1 week

markdownlint-job:
  stage: quality
  image: node:20
  before_script:
    - npm install -g markdownlint-cli
  script:
    - markdownlint "**/*.md"

sonarqube-check:
  stage: quality
  image: sonarsource/sonar-scanner-cli:latest
  variables:
    SONAR_USER_HOME: "${CI_PROJECT_DIR}/.sonar"
    GIT_DEPTH: "0"
  script:
    - sonar-scanner
  only:
    - merge_requests
    - main
    - dev
  allow_failure: true

deploy-job:
  stage: deploy
  environment: production
  script:
    - echo "Deploying application..."
    - echo "Application successfully deployed."